[project]
name = "google-voice-guide-adk"
version = "0.1.0"
description = "Live phone-call coaching agent using Google ADK"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.1",
  "google-adk>=1.19.0",
  "python-dotenv>=1.1.1",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
